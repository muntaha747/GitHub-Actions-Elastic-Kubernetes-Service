name: CICD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest #shared runner

    steps:
    - uses: actions/checkout@v4 #setup an environment. It means it will local copy on the runner
    - name: Set up JDK 17 # Each step has its own name
      uses: actions/setup-java@v4 # Installing JDK 
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

   
